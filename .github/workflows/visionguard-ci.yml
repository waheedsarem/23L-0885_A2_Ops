name: VisionGuard CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install test dependencies
        run: pip install -r requirements-ci.txt ruff
      - name: Lint critical Python errors
        run: ruff check webapp tests --select E9,F63,F7,F82
      - name: Run Flask tests
        run: python -m pytest tests/test_webapp.py -q
      - name: Build Docker image
        run: docker build --file Dockerfile --tag visionguard:${{ github.sha }} .
