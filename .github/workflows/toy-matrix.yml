name: Toy Python Matrix

on:
  push:
    paths:
      - "toy_ci/**"
      - ".github/workflows/toy-matrix.yml"

permissions:
  contents: read

jobs:
  unit-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest -v toy_ci/test_math.py
